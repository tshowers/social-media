<main class="sign-in">
  <img class="ms-avatar ms-avatar--64" src="assets/maya-avatar.png" alt="Maya" />
  <h1>Sign in to Maya Social</h1>
  <p>Use the account that has Maya. You’ll come straight back here.</p>
  <button type="button" class="ms-btn ms-btn--primary ms-btn--52" [disabled]="isSigningIn" (click)="signIn()">
    {{ isSigningIn ? 'Taking you to sign in…' : 'Sign in' }}
  </button>
</main>
