<main class="auth-callback">
  <p *ngIf="!errorMessage" class="waiting"><span class="ms-spinner" aria-hidden="true"></span>Signing you in…</p>
  <ng-container *ngIf="errorMessage">
    <p class="error" role="alert">{{ errorMessage }}</p>
    <a class="ms-btn ms-btn--primary" routerLink="/login">Try again</a>
  </ng-container>
</main>
